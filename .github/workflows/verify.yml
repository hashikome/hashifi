name: Verify
on:
  push:
    branches-ignore: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hashifi
          POSTGRES_PASSWORD: hashifi
          POSTGRES_DB: hashifi
        ports: ["5437:5432"]
        options: --health-cmd "pg_isready -U hashifi" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.4 }
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run test:integration
